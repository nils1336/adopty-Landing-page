<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle gradient accent top-right -->
  <radialGradient id="glow" cx="85%" cy="20%" r="40%">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#10b981" fill-opacity="0.1"/>
  <!-- Lightning bolt -->
  <path d="M117 92 103 116h10L109 140l18-26h-10l8-22z" fill="#10b981"/>

  <!-- Wordmark -->
  <text x="164" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="white" letter-spacing="-1">Adopty</text>

  <!-- Main headline -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">KI-Workflows teilen,</text>
  <text x="80" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#10b981" letter-spacing="-2">Adoption skalieren.</text>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.5)">Der interne Social Feed für KI-Workflows · ROI messen · DSGVO-konform</text>

  <!-- CTA badge -->
  <rect x="80" y="510" width="220" height="50" rx="25" fill="#10b981"/>
  <text x="190" y="541" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0a0a0a" text-anchor="middle">Kostenlose Beta</text>

  <!-- URL -->
  <text x="1120" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.3)" text-anchor="end">adopty.de</text>
</svg>
